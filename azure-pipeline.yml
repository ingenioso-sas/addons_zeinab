parameters:
  - name: pool_name
    displayName: agent pool location
    type: string
    default: default

resources:
 repositories:
   - repository: templates
     name: 'proy_ing/pipeline_templates'
     type: git
     ref: refs/heads/feature/devops


trigger:
  branches:
    include:
     - 13.0
  paths:
    include:
      - pos_orderline_salesperson/*

pool:
  name: 'default'


extends:
  template: templates/azure-pipeline-odooapp.yml@templates
  parameters:
    sonarqube_project_key: 'ingenioso-sas_addons_zeinab_38ad757a-ad0c-4c0b-a4e7-edd8d04d4e28'
    sonarqube_project_name: 'addons_zeinab-salesman'
    serviceConnection: sonarqube-connection
    sonarUrl: https://sonarqube.cloud.ingenioso.co/
    filter_version: "^13.1.[0-9\\.]+$"
    pool_name: ${{parameters.pool_name}}
    strategy_matrix:
      - name: pos_orderline_salesperson
        value: 'pos_orderline_salesperson'
